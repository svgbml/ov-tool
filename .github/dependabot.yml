version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/android"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      kleine-updates:
        update-types: ["minor", "patch"]
  - package-ecosystem: "npm"
    directory: "/worker"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      kleine-updates:
        update-types: ["minor", "patch"]
